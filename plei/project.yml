name: Plei
options:
  bundleIdPrefix: com.mylocal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Plei:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Плеер
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylocal.plei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  PleiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Plei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylocal.plei.tests

  PleiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Plei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mylocal.plei.uitests

schemes:
  Plei:
    build:
      targets:
        Plei: all
        PleiTests: [test]
        PleiUITests: [test]
    test:
      targets:
        - PleiTests
        - PleiUITests
