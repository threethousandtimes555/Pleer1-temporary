name: Pleer1 companion — focused read-only audit
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Одна задача для компаньона"
        required: true
        type: choice
        default: search
        options: [playback, search, diagnostics, history]
permissions:
  contents: read
concurrency:
  group: pleer1-companion-focused-audit
  cancel-in-progress: false
jobs:
  focused-audit:
    name: Focused Qwen3 8B audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout companion instructions and historical evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify read-only source token is configured
        env:
          PLEER1_READ_TOKEN: ${{ secrets.PLEER1_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PLEER1_READ_TOKEN:-}" ]]; then
            echo "::error::PLEER1_READ_TOKEN is not configured in repository Actions secrets. No private source was accessed."
            exit 1
          fi

      - name: Checkout the current private Pleer1 working branch (read-only)
        uses: actions/checkout@v4
        with:
          repository: threethousandtimes555/Pleer1
          ref: work/restore-youtube-module-2026-11-17
          token: ${{ secrets.PLEER1_READ_TOKEN }}
          path: pleer1-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and identify exact source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -s pleer1-source/plei/Sources/Player.swift
          test -s pleer1-source/plei/Sources/Providers.swift
          test -s pleer1-source/plei/Sources/YouTubeEngine.swift
          test -s pleer1-source/plei/UITests/SearchSmokeTests.swift
          SHA="$(git -C pleer1-source rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Auditing private Pleer1 working branch at $SHA"

      - name: Start local Ollama and load Qwen3 8B once
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          timeout --signal=TERM --kill-after=20s 35m docker exec ollama ollama pull qwen3:8b
          python3 --version

      - name: Run exactly one focused audit
        env:
          AUDIT_TASK: ${{ github.event.inputs.task || 'search' }}
          PLEER1_SOURCE_DIR: pleer1-source/plei/Sources
          PLEER1_TEST_DIR: pleer1-source/plei/UITests
          PLEER1_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/companion_audit.py "$AUDIT_TASK"

      - name: Upload focused report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-${{ github.event.inputs.task || 'search' }}
          path: reports/*.md
          if-no-files-found: warn
          retention-days: 30
