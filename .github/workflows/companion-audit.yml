name: Pleer1 companion — staged read-only Qwen3 audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/companion_audit.py
      - .github/workflows/companion-audit.yml

permissions:
  contents: read

concurrency:
  group: pleer1-companion-staged-audit
  cancel-in-progress: false

jobs:
  staged-audit:
    name: Staged local Qwen3 8B audit (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout temporary verification copy with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start temporary local Ollama and load Qwen3 8B once
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          timeout --signal=TERM --kill-after=20s 35m docker exec ollama ollama pull qwen3:8b
          python3 --version
          git log -1 --oneline

      - name: Stage 1 — map the commit history
        if: always()
        run: python3 .github/scripts/companion_audit.py history || true

      - name: Save Stage 1 report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-stage-01-history
          path: reports/01-history.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stage 2 — audit playback changes
        if: always()
        run: python3 .github/scripts/companion_audit.py playback || true

      - name: Save Stage 2 report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-stage-02-playback
          path: reports/02-playback.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stage 3 — audit YouTube search changes
        if: always()
        run: python3 .github/scripts/companion_audit.py search || true

      - name: Save Stage 3 report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-stage-03-search
          path: reports/03-search.md
          if-no-files-found: warn
          retention-days: 14

      - name: Stage 4 — audit diagnostics and propose minimal tests
        if: always()
        run: python3 .github/scripts/companion_audit.py diagnostics || true

      - name: Save Stage 4 report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-stage-04-diagnostics
          path: reports/04-diagnostics.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload all reports together
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-all-stages
          path: reports/*.md
          if-no-files-found: warn
          retention-days: 14
