name: Pleer1 companion — focused read-only audit
on:
  push:
    paths:
      - ".github/scripts/companion_audit.py"
  workflow_dispatch:
    inputs:
      task:
        description: "Одна задача для компаньона"
        required: true
        type: choice
        default: search
        options: [playback, search, diagnostics, history]
permissions:
  contents: read
concurrency:
  group: pleer1-companion-focused-audit
  cancel-in-progress: false
jobs:
  focused-audit:
    name: Focused Qwen3 8B audit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout companion instructions and historical evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose read-only token access without exposing it
        env:
          GH_TOKEN: ${{ secrets.PLEER1_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PLEER1_READ_TOKEN secret is empty or unavailable to this workflow."
            exit 1
          fi
          body="$RUNNER_TEMP/pleer1-token-check.json"
          status="$(curl --silent --show-error --output "$body" --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/threethousandtimes555/Pleer1)"
          echo "Repository API HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "GitHub API response: $(jq -r '.message // "No error message returned"' "$body" 2>/dev/null || echo "unreadable response")"
            echo "::error::The token could not read the Pleer1 repository metadata. Check token owner, selected repository, expiration, and Contents: Read-only permission."
            exit 1
          fi
          echo "Repository metadata access: OK"
          content_status="$(curl --silent --show-error --output "$body" --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/threethousandtimes555/Pleer1/contents/plei/Sources?ref=work/restore-youtube-module-2026-11-17")"
          echo "Source contents API HTTP status: $content_status"
          if [[ "$content_status" != "200" ]]; then
            echo "GitHub API response: $(jq -r '.message // "No error message returned"' "$body" 2>/dev/null || echo "unreadable response")"
            echo "::error::The token can read repository metadata but cannot read the source directory on the requested branch."
            exit 1
          fi
          echo "Source directory access: OK"
      - name: Checkout current Pleer1 working branch as audit source
        uses: actions/checkout@v4
        with:
          repository: threethousandtimes555/Pleer1
          token: ${{ secrets.PLEER1_READ_TOKEN }}
          ref: work/restore-youtube-module-2026-11-17
          path: source-project
          fetch-depth: 1
          persist-credentials: false
      - name: Start local Ollama and load Qwen3 8B once
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null
          timeout --signal=TERM --kill-after=20s 35m docker exec ollama ollama pull qwen3:8b
          python3 --version
          git -C source-project rev-parse HEAD
      - name: Run exactly one focused audit
        env:
          AUDIT_TASK: ${{ github.event.inputs.task || 'search' }}
          PLEER1_SOURCE_DIR: source-project/plei/Sources
          PLEER1_TEST_DIR: source-project/plei/UITests
        shell: bash
        run: |
          set -euo pipefail
          export PLEER1_SOURCE_SHA="$(git -C source-project rev-parse HEAD)"
          python3 .github/scripts/companion_audit.py "$AUDIT_TASK"
      - name: Upload focused report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleer1-companion-${{ github.event.inputs.task || 'search' }}
          path: reports/*.md
          if-no-files-found: warn
          retention-days: 30
